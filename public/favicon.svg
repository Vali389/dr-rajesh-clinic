<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182c48"/>
      <stop offset="50%" stop-color="#0f1d30"/>
      <stop offset="100%" stop-color="#08101b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE685"/>
      <stop offset="40%" stop-color="#DFAC37"/>
      <stop offset="100%" stop-color="#BF8A1E"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="100%" stop-color="#E29F1A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Badge Container with Gold Border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Medical Cross inside Emblem -->
  <g filter="url(#softGlow)">
    <path d="M57 36 H71 V49 H84 V63 H71 V76 H57 V63 H44 V49 H57 Z" fill="url(#crossGrad)"/>
  </g>

  <!-- Letter 'R' & Healing Leaf Curve -->
  <g filter="url(#softGlow)">
    <!-- Vertical stem of R -->
    <path d="M33 32 H44 V96 H33 Z" fill="url(#goldGrad)"/>
    <!-- Top serif and base serif -->
    <path d="M30 32 H52 V36 H30 Z" fill="url(#goldGrad)"/>
    <path d="M28 92 H49 V96 H28 Z" fill="url(#goldGrad)"/>
    <!-- Loop of R -->
    <path d="M42 32 H68 C83 32 94 41 94 53 C94 65 83 73 68 73 H42 V65 H67 C77 65 84 59 84 53 C84 46 77 40 67 40 H42 Z" fill="url(#goldGrad)"/>
    <!-- Leg of R flowing into vitality leaf -->
    <path d="M60 68 L81 96 H96 L73 66 C79 64 83 62 87 58 C85 64 80 69 73 72 L94 96 H80 L62 71 Z" fill="url(#goldGrad)"/>
    <!-- Vitality Leaf element -->
    <path d="M78 68 C88 62 99 66 102 77 C92 78 82 75 78 68 Z" fill="url(#goldGrad)"/>
    <path d="M80 70 C88 71 95 74 99 76" stroke="#0f1d30" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>